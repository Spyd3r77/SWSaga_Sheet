<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saga Hero Pro</title>

    <link rel="icon" type="image/webp" href="icon.webp">
    <link rel="apple-touch-icon" href="icon.webp">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Saga Hero">

    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; }
        body { font-family: 'Segoe UI', Helvetica, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 140px; line-height: 1.4; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; }
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; width: 100%; box-sizing: border-box; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; color: white; }
        .btn { background: var(--sw-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; transition: 0.2s; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .skill-row { display: grid; grid-template-columns: 1fr 40px 40px 50px; gap: 5px; align-items: center; font-size: 0.8rem; border-bottom: 1px solid #333; padding: 6px 0; }
        .power-item { background: #111; padding: 10px; border-radius: 6px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--sw-gold); }
        .spent { opacity: 0.3; text-decoration: line-through; filter: grayscale(1); }
        .weapon-card { background: #111; border: 1px solid #444; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 15px; font-size: 0.9rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 1000; box-sizing: border-box; font-weight: bold; box-shadow: 0 -5px 15px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col" style="flex:0.3"><label>Lvl</label><input type="number" id="lvl" value="1" oninput="calculate()"></div>
        </div>
        <div class="col">
            <label>Species Selection</label>
            <select id="speciesSelect" onchange="applySpecies()">
                <option value="Human">Human (+1 Feat/Skill)</option>
                <option value="Zabrak">Zabrak (+1 Defenses)</option>
                <option value="Miraluka">Miraluka (+2 Int, -2 Con)</option>
                <option value="Togruta">Togruta (+2 Dex, -2 Con)</option>
                <option value="Bothan">Bothan (+2 Dex, -2 Con)</option>
                <option value="Duros">Duros (+2 Dex, +2 Int, -2 Con)</option>
                <option value="Ewok">Ewok (+2 Dex, -2 Str)</option>
                <option value="Ithorian">Ithorian (+2 Wis, +2 Cha, -2 Dex)</option>
                <option value="Mon Calamari">Mon Calamari (+2 Int, +2 Wis, -2 Con)</option>
                <option value="Trandoshan">Trandoshan (+2 Str, -2 Dex)</option>
                <option value="Wookiee">Wookiee (+4 Str, +2 Con, -2 Dex)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h2>Abilities</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses</h2>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Combat</h2>
        <div class="flex">
            <div class="col"><label>BAB</label><input type="number" id="bab" value="0" oninput="calculate()"></div>
        </div>
        <div id="weaponsContainer"></div>
        <button class="btn" style="background:#444; width:100%" onclick="addWeapon()">+ Weapon</button>
    </div>

    <div class="card">
        <h2>Force Powers</h2>
        <div id="forcePowersList"></div>
        <div class="flex">
            <input type="text" id="newPowerName" placeholder="Power Name">
            <button class="btn" style="background:var(--green)" onclick="addPower()">Add</button>
        </div>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div id="skillList"></div>
    </div>

    <div class="card">
        <h2>Feats & Talents</h2>
        <textarea id="feats" rows="4"></textarea>
    </div>

    <div id="log">Log Ready...</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'},
            {n:'Endurance', a:'CON'}, {n:'Initiative', a:'DEX'}, {n:'Jump', a:'STR'},
            {n:'Mechanics', a:'INT'}, {n:'Perception', a:'WIS'}, {n:'Persuasion', a:'CHA'},
            {n:'Stealth', a:'DEX'}, {n:'Use the Force', a:'CHA'}
        ];

        const speciesData = {
            "Human": {mod:{}, note: "HUMAN: +1 extra Feat and +1 extra Trained Skill."},
            "Zabrak": {mod:{}, note: "ZABRAK: +1 Species bonus to all Defenses applied."},
            "Miraluka": {mod:{INT:2, CON:-2}, note: "FORCE SIGHT: You ignore darkness/cover."},
            "Togruta": {mod:{DEX:2, CON:-2}, note: "SPATIAL AWARENESS: Use Perception to sense surroundings."},
            "Bothan": {mod:{DEX:2, CON:-2}}, "Duros": {mod:{DEX:2, INT:2, CON:-2}},
            "Ewok": {mod:{DEX:2, STR:-2}}, "Ithorian": {mod:{WIS:2, CHA:2, DEX:-2}},
            "Mon Calamari": {mod:{INT:2, WIS:2, CON:-2}}, "Trandoshan": {mod:{STR:2, DEX:-2}},
            "Wookiee": {mod:{STR:4, CON:2, DEX:-2}}
        };

        let weaponCount = 0; let powers = [];

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="base_${s}" value="10" oninput="calculate()"><div id="specLabel_${s}" style="font-size:0.6rem; color:var(--sw-gold); text-align:center;">+0 Spec</div><div id="mod_${s}" style="text-align:center; font-weight:bold;">+0</div></div>`;
            });
            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => {
                skList.innerHTML += `<div class="skill-row"><span>${s.n}</span><input type="checkbox" id="skT_${i}" onchange="calculate()"><input type="checkbox" id="skF_${i}" onchange="calculate()"><div id="skVal_${i}" style="text-align:right; font-weight:bold; color:var(--sw-gold);">+0</div></div>`;
            });
            load();
            if(weaponCount === 0) addWeapon();
            renderPowers();
            calculate();
        }

        function addPower() {
            const name = document.getElementById('newPowerName').value;
            if(!name) return;
            powers.push({ name: name, spent: false });
            document.getElementById('newPowerName').value = '';
            renderPowers(); save();
        }

        function togglePower(i) {
            powers[i].spent = !powers[i].spent;
            renderPowers(); save();
        }

        function renderPowers() {
            const list = document.getElementById('forcePowersList');
            list.innerHTML = '';
            powers.forEach((p, i) => {
                list.innerHTML += `<div class="power-item ${p.spent ? 'spent' : ''}"><span>${p.name}</span><button class="btn" style="background:${p.spent ? '#555' : 'var(--sw-blue)'}; padding:5px 10px;" onclick="togglePower(${i})">${p.spent ? 'Reset' : 'Use'}</button></div>`;
            });
        }

        function addWeapon() {
            const id = weaponCount++;
            const div = document.createElement('div');
            div.className = 'weapon-card';
            div.innerHTML = `<input type="text" id="wName_${id}" placeholder="Weapon Name" style="margin-bottom:8px;"><div class="flex"><div class="col"><label>Type</label><select id="wType_${id}"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></div><div class="col"><label>Dmg</label><input type="text" id="wDmg_${id}" placeholder="2d8"></div></div><div class="flex" style="margin-top:10px;"><button class="btn" style="flex:1" onclick="rollAtk(${id})">Atk</button><button class="btn" style="flex:1; background:var(--red)" onclick="rollDmg(${id})">Dmg</button></div>`;
            document.getElementById('weaponsContainer').appendChild(div);
        }

        function rollAtk(id) {
            const bab = parseInt(document.getElementById('bab').value) || 0;
            const type = document.getElementById(`wType_${id}`).value;
            const mod = getModValue(type === 'melee' ? 'STR' : 'DEX');
            const d20 = Math.floor(Math.random() * 20) + 1;
            document.getElementById('log').innerHTML = `Roll: ${d20} + ${bab} + ${mod} = <strong>${d20+bab+mod}</strong>`;
        }

        function rollDmg(id) {
            const formula = document.getElementById(`wDmg_${id}`).value || "1d6";
            const bonus = Math.floor(parseInt(document.getElementById('lvl').value)/2) + (document.getElementById(`wType_${id}`).value === 'melee' ? getModValue('STR') : 0);
            const parts = formula.toLowerCase().split('d');
            let sum = 0;
            for(let i=0; i<(parseInt(parts[0])||1); i++) sum += Math.floor(Math.random() * (parseInt(parts[1])||6)) + 1;
            document.getElementById('log').innerHTML = `Damage: [${sum}] + ${bonus} = <strong>${sum+bonus}</strong>`;
        }

        function getModValue(stat) {
            const base = parseInt(document.getElementById(`base_${stat}`).value) || 10;
            const sp = document.getElementById('speciesSelect').value;
            const spec = speciesData[sp].mod[stat] || 0;
            return Math.floor((base + spec - 10) / 2);
        }

        function applySpecies() {
            const sp = document.getElementById('speciesSelect').value;
            const data = speciesData[sp];
            stats.forEach(s => {
                const val = data.mod[s] || 0;
                document.getElementById(`specLabel_${s}`).innerText = (val >= 0 ? '+' : '') + val + ' Spec';
            });
            document.getElementById('log').innerHTML = data.note || "Species Updated.";
            calculate();
        }

        function calculate() {
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const hLvl = Math.floor(lvl / 2);
            const sp = document.getElementById('speciesSelect').value;
            const zBonus = (sp === "Zabrak") ? 1 : 0;

            stats.forEach(s => {
                const m = getModValue(s);
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });

            document.getElementById('refVal').innerText = 10 + lvl + getModValue('DEX') + zBonus;
            document.getElementById('fortVal').innerText = 10 + lvl + getModValue('CON') + zBonus;
            document.getElementById('willVal').innerText = 10 + lvl + getModValue('WIS') + zBonus;

            skills.forEach((s, i) => {
                const total = hLvl + getModValue(s.a) + (document.getElementById(`skT_${i}`).checked ? 5 : 0) + (document.getElementById(`skF_${i}`).checked ? 5 : 0);
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });
            save();
        }

        function save() {
            const data = { weaponCount, powers };
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            localStorage.setItem('saga_hero_final_v10', JSON.stringify(data));
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_final_v10'));
            if(data) {
                powers = data.powers || [];
                for(let i=1; i<data.weaponCount; i++) addWeapon();
                Object.keys(data).forEach(id => { const el = document.getElementById(id); if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; } });
            }
        }
        setup();
    </script>
</body>
</html>
