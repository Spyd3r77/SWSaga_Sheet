<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saga Hero Ultimate Pro</title>
    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; --class-skill: #1a3a5a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 160px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; display: flex; justify-content: space-between; }
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: bold; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; color:white; }
        .btn { background: var(--sw-blue); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .skill-row { display: grid; grid-template-columns: 1fr 30px 30px 45px 50px; gap: 5px; align-items: center; font-size: 0.75rem; border-bottom: 1px solid #333; padding: 6px 4px; border-radius: 4px; }
        .is-class-skill { background: var(--class-skill); border-bottom-color: var(--sw-blue); }
        .xp-bar { height: 6px; background: #333; margin-top: 8px; border-radius: 3px; overflow: hidden; }
        .xp-progress { height: 100%; background: var(--sw-gold); transition: 0.3s; box-shadow: 0 0 8px var(--sw-gold); }
        .item-row { display: grid; grid-template-columns: 1fr 60px 40px; gap: 5px; margin-bottom: 5px; }
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 15px; font-size: 0.9rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 2000; box-sizing: border-box; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col"><label>Species</label>
                <select id="speciesSelect" onchange="calculate()">
                    <option value="Human">Human</option>
                    <option value="Zabrak">Zabrak</option>
                    <option value="Miraluka">Miraluka</option>
                    <option value="Togruta">Togruta</option>
                    <option value="Bothan">Bothan</option>
                    <option value="Wookiee">Wookiee</option>
                </select>
            </div>
            <div class="col" style="flex:0.35"><label>Lvl</label><div id="lvlDisplay" class="val" style="text-align:center; color:var(--sw-gold);">1</div></div>
        </div>
        <div class="col">
            <label>Experience Points (XP)</label>
            <input type="number" id="xpInput" value="0" oninput="calculate()">
            <div class="xp-bar"><div id="xpFill" class="xp-progress" style="width: 0%"></div></div>
        </div>
    </div>

    <div class="card">
        <h2>Vitals & Condition</h2>
        <div class="stat-grid">
            <div class="col"><label>HP (Cur/Max)</label><input type="text" id="hp" placeholder="30/30"></div>
            <div class="col"><label>Force Pts</label><input type="number" id="forcePts" value="5"></div>
            <div class="col"><label>Destiny Pts</label><input type="number" id="destinyPts" value="1"></div>
        </div>
        <div class="flex">
            <div class="col">
                <label>Condition Track</label>
                <select id="conditionTrack" onchange="calculate()">
                    <option value="0">Normal (0)</option>
                    <option value="-1">-1 Penalty</option>
                    <option value="-2">-2 Penalty</option>
                    <option value="-5">-5 Penalty</option>
                    <option value="-10">-10 Penalty</option>
                    <option value="-99">Unconscious</option>
                </select>
            </div>
            <div class="def-box" style="flex:0.5"><label>Threshold</label><span class="val" id="dmgThresh">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Classes & Automation</h2>
        <div id="classListContainer"></div>
        <button class="btn" style="background:#444; width:100%; margin-top:8px;" onclick="addClassRow()">+ Add Level</button>
        <p style="font-size:0.6rem; color:#888; margin-top:5px;">First class grants all starting feats. Blue highlight = Class Skill.</p>
    </div>

    <div class="card">
        <h2>Ability Scores</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses</h2>
        <div class="stat-grid">
            <div class="col"><label>Armor Bonus</label><input type="number" id="armorBonus" value="0" oninput="calculate()"></div>
            <div class="col"><label>Misc Def</label><input type="number" id="miscDef" value="0" oninput="calculate()"></div>
            <div class="def-box"><label>Total BAB</label><span class="val" id="babDisplay">0</span></div>
        </div>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Weapons</h2>
        <div id="weaponsContainer"></div>
        <button class="btn" style="background:#444; width:100%" onclick="addWeapon()">+ Add Weapon</button>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div id="skillList"></div>
    </div>

    <div class="card">
        <h2>Feats</h2>
        <div class="flex">
            <select id="featDropdown" style="flex:1;"></select>
            <button class="btn" style="background:var(--green);" onclick="addSelectedFeat()">Learn</button>
        </div>
        <textarea id="feats" rows="4" placeholder="Class feats auto-populate..." style="margin-top:8px;" oninput="calculate()"></textarea>
    </div>

    <div class="card">
        <h2>Talents</h2>
        <div class="flex">
            <select id="talentDropdown" style="flex:1;"></select>
            <button class="btn" style="background:var(--green);" onclick="addSelectedTalent()">Add</button>
        </div>
        <textarea id="talents" rows="4" placeholder="Learned Talents..." style="margin-top:8px;" oninput="calculate()"></textarea>
    </div>

    <div class="card">
        <h2>Force Powers</h2>
        <div id="forcePowersList"></div>
        <div class="flex" style="margin-top:10px;">
            <select id="powerDropdown" style="flex:1;"></select>
            <button class="btn" style="background:var(--green);" onclick="addSelectedPower()">Learn</button>
        </div>
    </div>

    <div class="card">
        <h2>Equipment</h2>
        <div id="equipContainer"></div>
        <div class="flex" style="margin-top:10px;">
            <input type="text" id="newEqName" placeholder="Item Name">
            <input type="number" id="newEqWeight" placeholder="Wt" style="width:60px;">
            <button class="btn" onclick="addEquip()">Add</button>
        </div>
        <div style="text-align:right; color:var(--sw-gold); font-size:0.8rem; margin-top:5px;">Total: <span id="totalWeight">0</span>kg</div>
    </div>

    <div id="log">Systems Online.</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'}, {n:'Endurance', a:'CON'},
            {n:'Gather Info', a:'CHA'}, {n:'Initiative', a:'DEX'}, {n:'Jump', a:'STR'}, {n:'Mechanics', a:'INT'},
            {n:'Perception', a:'WIS'}, {n:'Persuasion', a:'CHA'}, {n:'Pilot', a:'DEX'}, {n:'Ride', a:'DEX'},
            {n:'Stealth', a:'DEX'}, {n:'Survival', a:'WIS'}, {n:'Swim', a:'STR'}, {n:'Treat Injury', a:'WIS'},
            {n:'Use Computer', a:'INT'}, {n:'Use the Force', a:'CHA'}
        ];

        const classData = {
            "Jedi": { bab: 1, ref: 1, fort: 1, will: 1, feats: "Force Sensitivity, Weapon Proficiency (Lightsabers), Weapon Proficiency (Simple Weapons)", skills: ["Acrobatics", "Initiative", "Jump", "Perception", "Use the Force"] },
            "Noble": { bab: 0.75, ref: 1, fort: 0, will: 2, feats: "Linguist, Weapon Proficiency (Pistols), Weapon Proficiency (Simple Weapons)", skills: ["Deception", "Gather Info", "Perception", "Persuasion", "Ride", "Treat Injury", "Use Computer"] },
            "Scoundrel": { bab: 0.75, ref: 2, fort: 0, will: 1, feats: "Point Blank Shot, Weapon Proficiency (Pistols), Weapon Proficiency (Simple Weapons)", skills: ["Acrobatics", "Deception", "Gather Info", "Initiative", "Mechanics", "Perception", "Persuasion", "Pilot", "Stealth", "Use Computer"] },
            "Scout": { bab: 0.75, ref: 1, fort: 1, will: 1, feats: "Shake it Off, Weapon Proficiency (Rifles), Weapon Proficiency (Simple Weapons)", skills: ["Acrobatics", "Climb", "Endurance", "Initiative", "Jump", "Mechanics", "Perception", "Pilot", "Ride", "Stealth", "Survival", "Swim"] },
            "Soldier": { bab: 1, ref: 1, fort: 2, will: 0, feats: "Armor Proficiency (Light), Armor Proficiency (Medium), Weapon Proficiency (Pistols), Weapon Proficiency (Rifles), Weapon Proficiency (Simple Weapons)", skills: ["Climb", "Endurance", "Initiative", "Jump", "Mechanics", "Perception", "Pilot", "Swim", "Treat Injury"] }
        };

        const dbTalents = {
            "Jedi": ["Deflect", "Block", "Force Intuition", "Battle Meditation"],
            "Noble": ["Connections", "Wealth", "Inspiration", "Coordinate"],
            "Scoundrel": ["Sneak Attack", "Point Blank Shot", "Dastardly Strike"],
            "Scout": ["Evasion", "Hidden Movement", "Long Stride"],
            "Soldier": ["Devastating Attack", "Draw Fire", "Melee Smash", "Tough as Nails"]
        };

        const speciesData = {
            "Human": {mod:{}}, "Zabrak": {mod:{}}, "Miraluka": {mod:{INT:2, CON:-2}}, 
            "Togruta": {mod:{DEX:2, CON:-2}}, "Bothan": {mod:{DEX:2, CON:-2}}, "Wookiee": {mod:{STR:4, CON:2, DEX:-2}}
        };

        const dbFeats = [
            { name: "Acrobatic Strike", req: (c) => c.trained.includes("Acrobatics") },
            { name: "Cleave", req: (c) => c.allFeats.includes("power attack") },
            { name: "Double Attack", req: (c) => c.bab >= 6 },
            { name: "Force Training", req: (c) => c.hasForce },
            { name: "Skill Focus", req: (c) => c.trained.length > 0 },
            { name: "Weapon Finesse", req: (c) => c.bab >= 1 }
        ];

        const dbPowers = ["Battle Strike", "Force Slam", "Move Object", "Surge", "Mind Trick", "Force Thrust"];

        let charClasses = [{name: 'Jedi', lvl: 1}];
        let weaponCount = 0; let powers = []; let equipment = [];

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => { abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="base_${s}" value="10" oninput="calculate()"><div id="mod_${s}" style="text-align:center; font-weight:bold;">+0</div></div>`; });
            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => { skList.innerHTML += `<div class="skill-row" id="skRow_${i}"><span>${s.n}</span><input type="checkbox" id="skT_${i}" onchange="calculate()"><input type="checkbox" id="skF_${i}" onchange="calculate()"><div id="skVal_${i}" style="text-align:center; font-weight:bold; color:var(--sw-gold);">+0</div><button class="btn" style="padding:4px; font-size:0.6rem;" onclick="rollSkill(${i},'${s.n}')">Roll</button></div>`; });
            load();
            if(weaponCount === 0) addWeapon();
            renderClasses(); renderPowers(); renderEquip();
            calculate();
        }

        function calculate() {
            const xp = parseInt(document.getElementById('xpInput').value) || 0;
            const xpTable = [0, 1000, 3000, 6000, 10000, 15000, 21000, 28000, 36000, 45000, 55000, 66000, 78000, 91000, 105000, 120000, 136000, 153000, 171000, 190000];
            let level = 1; for (let i = 0; i < xpTable.length; i++) { if (xp >= xpTable[i]) level = i + 1; }
            document.getElementById('lvlDisplay').innerText = level;
            document.getElementById('xpFill').style.width = (level === 20 ? 100 : ((xp - xpTable[level-1]) / (xpTable[level] - xpTable[level-1])) * 100) + "%";

            let totalBab = 0; let maxRef = 0; let maxFort = 0; let maxWill = 0;
            let allClassSkills = [];
            charClasses.forEach(c => {
                const d = classData[c.name];
                totalBab += (c.lvl * d.bab);
                if(d.ref > maxRef) maxRef = d.ref; if(d.fort > maxFort) maxFort = d.fort; if(d.will > maxWill) maxWill = d.will;
                allClassSkills = [...new Set([...allClassSkills, ...d.skills])];
            });

            document.getElementById('babDisplay').innerText = Math.floor(totalBab);
            stats.forEach(s => { 
                const mod = getModValue(s);
                document.getElementById(`mod_${s}`).innerText = (mod >= 0 ? '+' : '') + mod;
            });

            const cond = parseInt(document.getElementById('conditionTrack').value) || 0;
            const armor = parseInt(document.getElementById('armorBonus').value) || 0;
            const misc = parseInt(document.getElementById('miscDef').value) || 0;

            document.getElementById('refVal').innerText = 10 + Math.max(level, armor) + getModValue('DEX') + maxRef + misc + cond;
            document.getElementById('fortVal').innerText = 10 + level + getModValue('CON') + maxFort + misc + cond;
            document.getElementById('willVal').innerText = 10 + level + getModValue('WIS') + maxWill + misc + cond;
            document.getElementById('dmgThresh').innerText = 10 + level + getModValue('CON') + maxFort + misc;

            const trained = [];
            skills.forEach((s, i) => {
                const row = document.getElementById(`skRow_${i}`);
                if(allClassSkills.includes(s.n)) row.classList.add('is-class-skill'); else row.classList.remove('is-class-skill');
                const isTrained = document.getElementById(`skT_${i}`).checked;
                if(isTrained) trained.push(s.n);
                const total = Math.floor(level/2) + getModValue(s.a) + (isTrained ? 5 : 0) + (document.getElementById(`skF_${i}`).checked ? 5 : 0) + cond;
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });

            const featText = document.getElementById('feats').value.toLowerCase();
            const charState = { bab: Math.floor(totalBab), trained, allFeats: featText, hasForce: featText.includes('force sensitivity') };
            
            updateDropdowns(charState);
            save();
        }

        function getModValue(stat) {
            const base = parseInt(document.getElementById(`base_${stat}`).value) || 10;
            const sp = document.getElementById('speciesSelect').value;
            return Math.floor((base + (speciesData[sp].mod[stat] || 0) - 10) / 2);
        }

        function updateDropdowns(state) {
            const fDrop = document.getElementById('featDropdown');
            fDrop.innerHTML = '<option value="">-- Learn Feat --</option>';
            dbFeats.forEach(f => { if(f.req(state) && !state.allFeats.includes(f.name.toLowerCase())) fDrop.innerHTML += `<option value="${f.name}">${f.name}</option>`; });

            const tDrop = document.getElementById('talentDropdown');
            tDrop.innerHTML = '<option value="">-- Choose Talent --</option>';
            charClasses.forEach(c => { (dbTalents[c.name] || []).forEach(t => tDrop.innerHTML += `<option value="${t} (${c.name})">${t} (${c.name})</option>`); });

            const pDrop = document.getElementById('powerDropdown');
            pDrop.innerHTML = state.hasForce ? '<option value="">-- Learn Power --</option>' : '<option>(Req. Force Sensitivity)</option>';
            if(state.hasForce) dbPowers.forEach(p => pDrop.innerHTML += `<option value="${p}">${p}</option>`);
        }

        function updateClass(index, newName) {
            charClasses[index].name = newName;
            if(index === 0) document.getElementById('feats').value = classData[newName].feats;
            calculate();
        }

        function addClassRow() { charClasses.push({name: 'Soldier', lvl: 1}); renderClasses(); calculate(); }
        function removeClass(i) { if(charClasses.length > 1) { charClasses.splice(i, 1); renderClasses(); calculate(); } }

        function renderClasses() {
            const cont = document.getElementById('classListContainer'); cont.innerHTML = '';
            charClasses.forEach((c, i) => {
                cont.innerHTML += `<div class="flex"><select onchange="updateClass(${i}, this.value)">${Object.keys(classData).map(cn => `<option value="${cn}" ${cn === c.name ? 'selected' : ''}>${cn}</option>`).join('')}</select><input type="number" value="${c.lvl}" oninput="charClasses[${i}].lvl=parseInt(this.value)||1; calculate()"><button class="btn" style="background:var(--red);" onclick="removeClass(${i})">X</button></div>`;
            });
        }

        function rollSkill(index, name) {
            const val = parseInt(document.getElementById(`skVal_${index}`).innerText);
            const d20 = Math.floor(Math.random() * 20) + 1;
            document.getElementById('log').innerHTML = `<b>${name}:</b> [${d20}] + ${val} = <span style="font-size:1.2rem; color:white;">${d20 + val}</span>`;
        }

        function addWeapon() {
            const id = weaponCount++;
            const div = document.createElement('div'); div.className = 'card'; div.style.border="1px solid #444";
            div.innerHTML = `<input type="text" placeholder="Weapon Name"><div class="flex"><select id="wStat_${id}"><option value="STR">Melee (STR)</option><option value="DEX">Ranged (DEX)</option></select><input type="text" id="wDmgDice_${id}" placeholder="e.g. 2d8"></div><div class="flex"><button class="btn" style="flex:1" onclick="rollAtk(${id})">Atk</button><button class="btn" style="flex:1; background:var(--red)" onclick="rollDmg(${id})">Dmg</button></div>`;
            document.getElementById('weaponsContainer').appendChild(div);
        }

        function rollAtk(id) {
            const bab = parseInt(document.getElementById('babDisplay').innerText);
            const mod = getModValue(document.getElementById(`wStat_${id}`).value);
            const cond = parseInt(document.getElementById('conditionTrack').value) || 0;
            const d20 = Math.floor(Math.random() * 20) + 1;
            document.getElementById('log').innerHTML = `<b>Attack:</b> [${d20}] + BAB(${bab}) + Mod(${mod}) + Cond(${cond}) = <span style="font-size:1.2rem; color:white;">${d20+bab+mod+cond}</span>`;
        }

        function rollDmg(id) {
            const formula = document.getElementById(`wDmgDice_${id}`).value || "1d6";
            const bonus = Math.floor(parseInt(document.getElementById('lvlDisplay').innerText)/2) + (document.getElementById(`wStat_${id}`).value === 'STR' ? getModValue('STR') : 0);
            const d = formula.split('d'); let sum = 0;
            for(let i=0; i<(parseInt(d[0])||1); i++) sum += Math.floor(Math.random() * (parseInt(d[1])||6)) + 1;
            document.getElementById('log').innerHTML = `<b>Damage:</b> Dice(${sum}) + Bonus(${bonus}) = <span style="font-size:1.2rem; color:var(--red);">${sum+bonus}</span>`;
        }

        function addSelectedFeat() { const val = document.getElementById('featDropdown').value; if(val) { document.getElementById('feats').value += (document.getElementById('feats').value ? "\n" : "") + val; calculate(); } }
        function addSelectedTalent() { const val = document.getElementById('talentDropdown').value; if(val) { document.getElementById('talents').value += (document.getElementById('talents').value ? "\n" : "") + val; calculate(); } }
        function addSelectedPower() { const val = document.getElementById('powerDropdown').value; if(val) { powers.push({name: val, spent: false}); renderPowers(); save(); } }
        function renderPowers() {
            const list = document.getElementById('forcePowersList'); list.innerHTML = '';
            powers.forEach((p, i) => { list.innerHTML += `<div class="item-row" style="background:#111; padding:5px; border-radius:4px;"><span style="${p.spent?'text-decoration:line-through;color:#666':''}">${p.name}</span><button class="btn" style="padding:2px; background:${p.spent?'#444':'var(--sw-blue)'}" onclick="powers[${i}].spent=!powers[${i}].spent; renderPowers();">${p.spent?'Rest':'Use'}</button></div>`; });
        }

        function addEquip() { const n = document.getElementById('newEqName').value; const w = parseFloat(document.getElementById('newEqWeight').value)||0; if(n){ equipment.push({n, w}); renderEquip(); save(); } }
        function renderEquip() {
            const list = document.getElementById('equipContainer'); list.innerHTML = ''; let sum = 0;
            equipment.forEach((e, i) => { sum += e.w; list.innerHTML += `<div class="item-row"><span>${e.n}</span><span>${e.w}kg</span><button class="btn" style="background:var(--red);padding:2px" onclick="equipment.splice(${i},1); renderEquip();">X</button></div>`; });
            document.getElementById('totalWeight').innerText = sum.toFixed(1);
        }

        function save() {
            const data = { charClasses, weaponCount, powers, equipment };
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            localStorage.setItem('saga_hero_pro_v4', JSON.stringify(data));
        }
        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_pro_v4'));
            if(data) {
                if(data.charClasses) charClasses = data.charClasses; if(data.powers) powers = data.powers; if(data.equipment) equipment = data.equipment;
                for(let i=1; i<data.weaponCount; i++) addWeapon();
                Object.keys(data).forEach(id => { const el = document.getElementById(id); if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; } });
            }
        }
        setup();
    </script>
</body>
</html>
