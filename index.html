<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saga Hero Ultimate v1.1</title>
    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; --class-skill: #1a3a5a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 160px; -webkit-tap-highlight-color: transparent; }
        
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; color: white; }
        
        .btn { background: var(--sw-blue); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; transition: filter 0.2s; }
        .btn:active { filter: brightness(1.3); }
        
        /* Updated Grid for Skill Labels */
        .skill-header { display: grid; grid-template-columns: 1fr 30px 30px 45px 50px; gap: 5px; font-size: 0.55rem; color: var(--sw-gold); font-weight: bold; text-transform: uppercase; padding: 0 4px 5px 4px; text-align: center; }
        .skill-row { display: grid; grid-template-columns: 1fr 30px 30px 45px 50px; gap: 5px; align-items: center; font-size: 0.75rem; border-bottom: 1px solid #333; padding: 6px 4px; }
        .is-class-skill { background: var(--class-skill); border-bottom-color: var(--sw-blue); }
        
        .xp-bar { height: 6px; background: #333; margin-top: 8px; border-radius: 3px; overflow: hidden; }
        .xp-progress { height: 100%; background: var(--sw-gold); transition: 0.5s ease-out; box-shadow: 0 0 8px var(--sw-gold); }
        
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 15px; font-size: 0.9rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 2000; box-sizing: border-box; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col"><label>Species</label>
                <select id="speciesSelect" onchange="calculate()">
                    <option value="Human">Human</option>
                    <option value="Bothan">Bothan</option>
                    <option value="Cerean">Cerean</option>
                    <option value="Duros">Duros</option>
                    <option value="Ewok">Ewok</option>
                    <option value="Gamorrean">Gamorrean</option>
                    <option value="Gungan">Gungan</option>
                    <option value="Ithorian">Ithorian</option>
                    <option value="Kel Dor">Kel Dor</option>
                    <option value="Miraluka">Miraluka</option>
                    <option value="Mon Calamari">Mon Calamari</option>
                    <option value="Quarren">Quarren</option>
                    <option value="Rodian">Rodian</option>
                    <option value="Sullustan">Sullustan</option>
                    <option value="Togruta">Togruta</option>
                    <option value="Trandoshan">Trandoshan</option>
                    <option value="Twi'lek">Twi'lek</option>
                    <option value="Wookiee">Wookiee</option>
                    <option value="Zabrak">Zabrak</option>
                </select>
            </div>
            <div class="col" style="flex:0.35"><label>Lvl</label><div id="lvlDisplay" class="val" style="text-align:center; color:var(--sw-gold);">1</div></div>
        </div>
        <div class="col">
            <label>Experience Points (XP)</label>
            <input type="number" id="xpInput" value="0" oninput="calculate()">
            <div class="xp-bar"><div id="xpFill" class="xp-progress" style="width: 0%"></div></div>
        </div>
    </div>

    <div class="card" style="border: 1px solid var(--sw-gold);">
        <h2>Universal Dice Roller</h2>
        <div class="flex">
            <div class="col" style="flex:0.5;"><label>Qty</label><input type="number" id="diceQty" value="1" min="1"></div>
            <div class="col"><label>Die Type</label>
                <select id="diceType">
                    <option value="4">d4</option>
                    <option value="6">d6</option>
                    <option value="8">d8</option>
                    <option value="10">d10</option>
                    <option value="12">d12</option>
                    <option value="20" selected>d20</option>
                    <option value="100">% (d100)</option>
                </select>
            </div>
            <button class="btn" style="background:var(--sw-gold); color:#000; height:40px; margin-top:14px; padding: 0 20px;" onclick="universalRoll()">Roll</button>
        </div>
    </div>

    <div class="card">
        <h2>Defenses & Combat</h2>
        <div class="stat-grid">
            <div class="col"><label>Armor Bonus</label><input type="number" id="armorBonus" value="0" oninput="calculate()"></div>
            <div class="col"><label>Misc Def</label><input type="number" id="miscDef" value="0" oninput="calculate()"></div>
            <div class="def-box"><label>Total BAB</label><span class="val" id="babDisplay">0</span></div>
        </div>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Classes & Skills</h2>
        <div id="classListContainer"></div>
        <button class="btn" style="background:#444; width:100%; margin:8px 0;" onclick="addClassRow()">+ Add Level</button>
        
        <div class="skill-header">
            <span style="text-align:left">Skill Name</span>
            <span>Train</span>
            <span>Focus</span>
            <span>Total</span>
            <span>Action</span>
        </div>
        <div id="skillList"></div>
    </div>

    <div id="log">Systems Online.</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'}, {n:'Endurance', a:'CON'},
            {n:'Gather Info', a:'CHA'}, {n:'Initiative', a:'DEX'}, {n:'Jump', a:'STR'}, {n:'Mechanics', a:'INT'},
            {n:'Perception', a:'WIS'}, {n:'Persuasion', a:'CHA'}, {n:'Pilot', a:'DEX'}, {n:'Ride', a:'DEX'},
            {n:'Stealth', a:'DEX'}, {n:'Survival', a:'WIS'}, {n:'Swim', a:'STR'}, {n:'Treat Injury', a:'WIS'},
            {n:'Use Computer', a:'INT'}, {n:'Use the Force', a:'CHA'}
        ];

        const speciesData = {
            "Human": {mod:{}}, "Bothan": {mod:{DEX:2, CON:-2}}, "Cerean": {mod:{INT:2, WIS:2, DEX:-2}},
            "Duros": {mod:{DEX:2, INT:2, CON:-2, CHA:-2}}, "Ewok": {mod:{DEX:2, STR:-2}}, "Gamorrean": {mod:{STR:4, INT:-2, CHA:-2}},
            "Gungan": {mod:{DEX:2, INT:-2, CHA:-2}}, "Ithorian": {mod:{WIS:2, CHA:2, DEX:-2}}, "Kel Dor": {mod:{DEX:2, WIS:2, CON:-2}},
            "Miraluka": {mod:{INT:2, CON:-2}}, "Mon Calamari": {mod:{INT:2, WIS:2, CON:-2}}, "Quarren": {mod:{CON:2, WIS:-2, CHA:-2}},
            "Rodian": {mod:{DEX:2, WIS:-2, CHA:-2}}, "Sullustan": {mod:{DEX:2, CON:-2}}, "Togruta": {mod:{DEX:2, CON:-2}},
            "Trandoshan": {mod:{STR:2, DEX:-2}}, "Twi'lek": {mod:{CHA:2, WIS:-2}}, "Wookiee": {mod:{STR:4, CON:2, DEX:-2}}, "Zabrak": {mod:{}}
        };

        const classData = {
            "Jedi": { bab: 1, ref: 1, fort: 1, will: 1, skills: ["Acrobatics", "Initiative", "Jump", "Perception", "Use the Force"] },
            "Noble": { bab: 0.75, ref: 1, fort: 0, will: 2, skills: ["Deception", "Gather Info", "Perception", "Persuasion", "Ride", "Treat Injury", "Use Computer"] },
            "Scoundrel": { bab: 0.75, ref: 2, fort: 0, will: 1, skills: ["Acrobatics", "Deception", "Gather Info", "Initiative", "Mechanics", "Perception", "Persuasion", "Pilot", "Stealth", "Use Computer"] },
            "Scout": { bab: 0.75, ref: 1, fort: 1, will: 1, skills: ["Acrobatics", "Climb", "Endurance", "Initiative", "Jump", "Mechanics", "Perception", "Pilot", "Ride", "Stealth", "Survival", "Swim"] },
            "Soldier": { bab: 1, ref: 1, fort: 2, will: 0, skills: ["Climb", "Endurance", "Initiative", "Jump", "Mechanics", "Perception", "Pilot", "Swim", "Treat Injury"] }
        };

        let charClasses = [{name: 'Jedi', lvl: 1}];

        function setup() {
            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => { 
                skList.innerHTML += `<div class="skill-row" id="skRow_${i}"><span>${s.n}</span><input type="checkbox" id="skT_${i}" onchange="calculate()"><input type="checkbox" id="skF_${i}" onchange="calculate()"><div id="skVal_${i}" style="text-align:center; font-weight:bold; color:var(--sw-gold);">+0</div><button class="btn" style="padding:4px; font-size:0.6rem;" onclick="rollSkill(${i},'${s.n}')">Roll</button></div>`; 
            });
            renderClasses();
            calculate();
        }

        function calculate() {
            const xp = parseInt(document.getElementById('xpInput').value) || 0;
            const xpTable = [0, 1000, 3000, 6000, 10000, 15000, 21000, 28000, 36000, 45000, 55000, 66000, 78000, 91000, 105000, 120000, 136000, 153000, 171000, 190000];
            let level = 1; for (let i = 0; i < xpTable.length; i++) { if (xp >= xpTable[i]) level = i + 1; }
            document.getElementById('lvlDisplay').innerText = level;
            document.getElementById('xpFill').style.width = (level === 20 ? 100 : ((xp - xpTable[level-1]) / (xpTable[level] - xpTable[level-1])) * 100) + "%";

            let totalBab = 0; let allClassSkills = [];
            charClasses.forEach(c => {
                totalBab += (c.lvl * classData[c.name].bab);
                allClassSkills = [...new Set([...allClassSkills, ...classData[c.name].skills])];
            });

            document.getElementById('babDisplay').innerText = Math.floor(totalBab);

            skills.forEach((s, i) => {
                const row = document.getElementById(`skRow_${i}`);
                if(allClassSkills.includes(s.n)) row.classList.add('is-class-skill'); else row.classList.remove('is-class-skill');
                const isTrained = document.getElementById(`skT_${i}`).checked;
                const isFocus = document.getElementById(`skF_${i}`).checked;
                const total = Math.floor(level/2) + (isTrained ? 5 : 0) + (isFocus ? 5 : 0);
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });
        }

        function universalRoll() {
            const qty = parseInt(document.getElementById('diceQty').value) || 1;
            const sides = parseInt(document.getElementById('diceType').value);
            let results = []; let total = 0;
            for(let i=0; i<qty; i++) { let r = Math.floor(Math.random() * sides) + 1; results.push(r); total += r; }
            document.getElementById('log').innerHTML = `<b>Rolling ${qty}d${sides}:</b> [${results.join(', ')}] = <span style="font-size:1.3rem; color:white;">${total}</span>`;
        }

        function renderClasses() {
            const cont = document.getElementById('classListContainer'); cont.innerHTML = '';
            charClasses.forEach((c, i) => {
                cont.innerHTML += `<div class="flex"><select onchange="charClasses[${i}].name=this.value; calculate()">${Object.keys(classData).map(cn => `<option value="${cn}" ${cn === c.name ? 'selected' : ''}>${cn}</option>`).join('')}</select><input type="number" value="${c.lvl}" oninput="charClasses[${i}].lvl=parseInt(this.value)||1; calculate()"><button class="btn" style="background:var(--red);" onclick="charClasses.splice(${i},1); renderClasses(); calculate()">X</button></div>`;
            });
        }

        function addClassRow() { charClasses.push({name: 'Soldier', lvl: 1}); renderClasses(); calculate(); }

        function rollSkill(index, name) {
            const val = parseInt(document.getElementById(`skVal_${index}`).innerText);
            const d20 = Math.floor(Math.random() * 20) + 1;
            document.getElementById('log').innerHTML = `<b>${name}:</b> [${d20}] + ${val} = <span style="font-size:1.2rem; color:white;">${d20 + val}</span>`;
        }

        setup();
    </script>
</body>
</html>
