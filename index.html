<!DOCTYPE html>
<html lang="en">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Character Name</label><input type="text" id="charName" placeholder="Luke Skywalker"></div>
            <div class="col" style="flex:0.3"><label>Level</label><input type="number" id="lvl" value="1" oninput="calculate()"></div>
        </div>
        <div class="col">
            <label>Species Selection</label>
            <select id="speciesSelect" onchange="applySpecies()">
                <option value="Human">Human (+1 Feat, +1 Skill)</option>
                <option value="Zabrak">Zabrak (+1 All Defenses)</option>
                <option value="Miraluka">Miraluka (+2 Int, -2 Con)</option>
                <option value="Togruta">Togruta (+2 Dex, -2 Con)</option>
                <option value="Bothan">Bothan (+2 Dex, -2 Con)</option>
                <option value="Cerean">Cerean (+2 Int, +2 Wis, -2 Dex)</option>
                <option value="Duros">Duros (+2 Dex, +2 Int, -2 Con)</option>
                <option value="Ewok">Ewok (+2 Dex, -2 Str)</option>
                <option value="Gamorrean">Gamorrean (+2 Str, -2 Int, -2 Cha)</option>
                <option value="Ithorian">Ithorian (+2 Wis, +2 Cha, -2 Dex)</option>
                <option value="Kel Dor">Kel Dor (+2 Dex, +2 Wis, -2 Con)</option>
                <option value="Mon Calamari">Mon Calamari (+2 Int, +2 Wis, -2 Con)</option>
                <option value="Rodian">Rodian (+2 Dex, -2 Wis, -2 Cha)</option>
                <option value="Trandoshan">Trandoshan (+2 Str, -2 Dex)</option>
                <option value="Twi'lek">Twi'lek (+2 Cha, -2 Wis)</option>
                <option value="Wookiee">Wookiee (+4 Str, +2 Con, -2 Dex)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h2>Ability Scores</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses</h2>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Combat & Weapons</h2>
        <div class="flex">
            <div class="col"><label>Base Attack Bonus</label><input type="number" id="bab" value="0" oninput="calculate()"></div>
        </div>
        <div id="weaponsContainer"></div>
        <button class="btn" style="background:#444; width:100%" onclick="addWeapon()">+ Add New Weapon</button>
    </div>

    <div class="card">
        <h2>Force Powers</h2>
        <div id="forcePowersList"></div>
        <div class="flex" style="margin-top:10px;">
            <input type="text" id="newPowerName" placeholder="Power Name">
            <button class="btn" style="background:var(--green); min-width:60px;" onclick="addPower()">Add</button>
        </div>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div class="skill-row" style="color:var(--sw-gold); font-weight:bold; border:none;">
            <span>Skill Name</span><span>Trn</span><span>Foc</span><span>Total</span>
        </div>
        <div id="skillList"></div>
    </div>

    <div class="card">
        <h2>Feats & Talents</h2>
        <textarea id="feats" rows="5" placeholder="Enter Feats and Talents..."></textarea>
    </div>

    <div id="log">Welcome to the Galaxy.</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'},
            {n:'Endurance', a:'CON'}, {n:'Gather Info', a:'CHA'}, {n:'Initiative', a:'DEX'},
            {n:'Jump', a:'STR'}, {n:'Mechanics', a:'INT'}, {n:'Perception', a:'WIS'},
            {n:'Persuasion', a:'CHA'}, {n:'Pilot', a:'DEX'}, {n:'Stealth', a:'DEX'},
            {n:'Survival', a:'WIS'}, {n:'Use Computer', a:'INT'}, {n:'Use the Force', a:'CHA'}
        ];

        const speciesData = {
            "Human": {mod:{}, note: "HUMAN: +1 extra Feat and +1 extra Trained Skill."},
            "Zabrak": {mod:{}, note: "ZABRAK: +1 Species bonus to all Defenses applied."},
            "Miraluka": {mod:{INT:2, CON:-2}, note: "FORCE SIGHT: Ignore darkness/cover; can't see droids physically."},
            "Togruta": {mod:{DEX:2, CON:-2}, note: "SPATIAL AWARENESS: Perception bonus applied."},
            "Bothan": {mod:{DEX:2, CON:-2}},
            "Cerean": {mod:{INT:2, WIS:2, DEX:-2}},
            "Duros": {mod:{DEX:2, INT:2, CON:-2}},
            "Ewok": {mod:{DEX:2, STR:-2}},
            "Gamorrean": {mod:{STR:2, INT:-2, CHA:-2}},
            "Ithorian": {mod:{WIS:2, CHA:2, DEX:-2}},
            "Kel Dor": {mod:{DEX:2, WIS:2, CON:-2}},
            "Mon Calamari": {mod:{INT:2, WIS:2, CON:-2}},
            "Rodian": {mod:{DEX:2, WIS:-2, CHA:-2}},
            "Trandoshan": {mod:{STR:2, DEX:-2}},
            "Twi'lek": {mod:{CHA:2, WIS:-2}},
            "Wookiee": {mod:{STR:4, CON:2, DEX:-2}}
        };

        let weaponCount = 0;
        let powers = [];

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `
                    <div class="col">
                        <label>${s}</label>
                        <input type="number" id="base_${s}" value="10" oninput="calculate()">
                        <div id="specLabel_${s}" style="font-size:0.6rem; color:var(--sw-gold); text-align:center;">+0 Spec</div>
                        <div id="mod_${s}" style="text-align:center; font-weight:bold; margin-top:2px;">+0</div>
                    </div>`;
            });

            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => {
                skList.innerHTML += `
                    <div class="skill-row">
                        <span>${s.n}</span>
                        <input type="checkbox" id="skT_${i}" onchange="calculate()">
                        <input type="checkbox" id="skF_${i}" onchange="calculate()">
                        <div id="skVal_${i}" style="text-align:right; font-weight:bold; color:var(--sw-gold);">+0</div>
                    </div>`;
            });
            load();
            if(weaponCount === 0) addWeapon();
            renderPowers();
            calculate();
        }

        function addPower() {
            const name = document.getElementById('newPowerName').value;
            if(!name) return;
            powers.push({ name: name, spent: false });
            document.getElementById('newPowerName').value = '';
            renderPowers();
            save();
        }

        function togglePower(i) {
            powers[i].spent = !powers[i].spent;
            renderPowers();
            save();
        }

        function renderPowers() {
            const list = document.getElementById('forcePowersList');
            list.innerHTML = '';
            powers.forEach((p, i) => {
                list.innerHTML += `
                    <div class="power-item ${p.spent ? 'spent' : ''}">
                        <span>${p.name}</span>
                        <button class="btn" style="background:${p.spent ? '#555' : 'var(--sw-blue)'}; padding:5px 10px;" onclick="togglePower(${i})">
                            ${p.spent ? 'Recharge' : 'Use'}
                        </button>
                    </div>`;
            });
        }

        function addWeapon() {
            const id = weaponCount++;
            const div = document.createElement('div');
            div.className = 'weapon-card';
            div.innerHTML = `
                <input type="text" id="wName_${id}" placeholder="Lightsaber / Blaster" style="margin-bottom:8px;">
                <div class="flex">
                    <div class="col"><label>Type</label><select id="wType_${id}"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></div>
                    <div class="col"><label>Damage Dice</label><input type="text" id="wDmg_${id}" placeholder="2d8"></div>
                </div>
                <div class="flex" style="margin-top:10px;">
                    <button class="btn" style="flex:1" onclick="rollAtk(${id})">Attack</button>
                    <button class="btn" style="flex:1; background:var(--red)" onclick="rollDmg(${id})">Damage</button>
                </div>`;
            document.getElementById('weaponsContainer').appendChild(div);
        }

        function rollAtk(id) {
            const bab = parseInt(document.getElementById('bab').value) || 0;
            const type = document.getElementById(`wType_${id}`).value;
            const mod = getModValue(type === 'melee' ? 'STR' : 'DEX');
            const d20 = Math.floor(Math.random() * 20) + 1;
            document.getElementById('log').innerHTML = `Roll: ${d20} + ${bab}(BAB) + ${mod}(Mod) = <strong>${d20+bab+mod}</strong>`;
        }

        function rollDmg(id) {
            const formula = document.getElementById(`wDmg_${id}`).value || "1d6";
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const type = document.getElementById(`wType_${id}`).value;
            const bonus = Math.floor(lvl / 2) + (type === 'melee' ? getModValue('STR') : 0);
            
            try {
                const parts = formula.toLowerCase().split('d');
                let sum = 0;
                for(let i=0; i<(parseInt(parts[0])||1); i++) sum += Math.floor(Math.random() * (parseInt(parts[1])||6)) + 1;
                document.getElementById('log').innerHTML = `Damage: [${sum}] + ${bonus}(Heroic) = <strong>${sum+bonus}</strong>`;
            } catch(e) { document.getElementById('log').innerText = "Dice Error (Ex: 2d8)"; }
        }

        function getModValue(stat) {
            const base = parseInt(document.getElementById(`base_${stat}`).value) || 10;
            const spName = document.getElementById('speciesSelect').value;
            const spec = speciesData[spName].mod[stat] || 0;
            return Math.floor((base + spec - 10) / 2);
        }

        function applySpecies() {
            const sp = document.getElementById('speciesSelect').value;
            const data = speciesData[sp];
            stats.forEach(s => {
                const val = data.mod[s] || 0;
                document.getElementById(`specLabel_${s}`).innerText = (val >= 0 ? '+' : '') + val + ' Spec';
            });
            document.getElementById('log').innerHTML = data.note || "Species Updated.";
            calculate();
        }

        function calculate() {
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const hLvl = Math.floor(lvl / 2);
            const sp = document.getElementById('speciesSelect').value;
            const zBonus = (sp === "Zabrak") ? 1 : 0;

            stats.forEach(s => {
                const m = getModValue(s);
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });

            document.getElementById('refVal').innerText = 10 + lvl + getModValue('DEX') + zBonus;
            document.getElementById('fortVal').innerText = 10 + lvl + getModValue('CON') + zBonus;
            document.getElementById('willVal').innerText = 10 + lvl + getModValue('WIS') + zBonus;

            skills.forEach((s, i) => {
                const total = hLvl + getModValue(s.a) + (document.getElementById(`skT_${i}`).checked ? 5 : 0) + (document.getElementById(`skF_${i}`).checked ? 5 : 0);
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });
            save();
        }

        function save() {
            const data = { weaponCount, powers };
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            localStorage.setItem('saga_hero_v7', JSON.stringify(data));
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_v7'));
            if(data) {
                powers = data.powers || [];
                for(let i=1; i<data.weaponCount; i++) addWeapon();
                Object.keys(data).forEach(id => { const el = document.getElementById(id); if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; } });
            }
        }
        setup();
    </script>
</body>
</html>
