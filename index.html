<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saga Hero Pro</title>

    <link rel="icon" type="image/webp" href="icon.webp?v=9">
    <link rel="apple-touch-icon" href="icon.webp?v=9">
    
    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 160px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; }
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: bold; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; }
        .btn { background: var(--sw-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .skill-row { display: grid; grid-template-columns: 1fr 45px 45px 55px; gap: 5px; align-items: center; font-size: 0.85rem; border-bottom: 1px solid #333; padding: 8px 0; }
        .xp-bar { height: 6px; background: #333; margin-top: 8px; border-radius: 3px; overflow: hidden; }
        .xp-progress { height: 100%; background: var(--sw-gold); transition: 0.3s; box-shadow: 0 0 8px var(--sw-gold); }
        .milestone { color: var(--green); font-size: 0.75rem; font-weight: bold; margin-top: 5px; display: block; }
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 15px; font-size: 0.9rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 2000; box-sizing: border-box; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col" style="flex:0.35"><label>Level</label><div id="lvlDisplay" class="val" style="text-align:center; color:var(--sw-gold);">1</div></div>
        </div>
        <div class="col">
            <label>Experience Points (XP)</label>
            <input type="number" id="xpInput" value="0" oninput="calculate()">
            <div class="xp-bar"><div id="xpFill" class="xp-progress" style="width: 0%"></div></div>
            <span id="nextLevelMsg" class="milestone"></span>
        </div>
    </div>

    <div class="card">
        <h2>Ability Scores</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses & Primary Class</h2>
        <select id="classSelect" onchange="calculate()" style="margin-bottom:10px;">
            <option value="Jedi">Jedi</option>
            <option value="Noble">Noble</option>
            <option value="Scoundrel">Scoundrel</option>
            <option value="Scout">Scout</option>
            <option value="Soldier">Soldier</option>
        </select>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div id="skillList"></div>
    </div>

    <div class="card">
        <h2>Feats & Talents</h2>
        <textarea id="feats" rows="5" placeholder="Add feats here..."></textarea>
    </div>

    <div id="log">Awaiting XP Input...</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'},
            {n:'Endurance', a:'CON'}, {n:'Initiative', a:'DEX'}, {n:'Jump', a:'STR'},
            {n:'Perception', a:'WIS'}, {n:'Persuasion', a:'CHA'}, {n:'Stealth', a:'DEX'},
            {n:'Use the Force', a:'CHA'}
        ];

        const xpTable = [0, 1000, 3000, 6000, 10000, 15000, 21000, 28000, 36000, 45000, 55000, 66000, 78000, 91000, 105000, 120000, 136000, 153000, 171000, 190000];

        const classData = {
            "Jedi": { ref: 1, fort: 1, will: 1 },
            "Noble": { ref: 1, fort: 0, will: 2 },
            "Scoundrel": { ref: 2, fort: 0, will: 1 },
            "Scout": { ref: 1, fort: 1, will: 1 },
            "Soldier": { ref: 1, fort: 2, will: 0 }
        };

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="base_${s}" value="10" oninput="calculate()"><div id="mod_${s}" style="text-align:center; font-weight:bold;">+0</div></div>`;
            });
            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => {
                skList.innerHTML += `<div class="skill-row"><span>${s.n}</span><input type="checkbox" id="skT_${i}" onchange="calculate()"><input type="checkbox" id="skF_${i}" onchange="calculate()"><div id="skVal_${i}" style="text-align:right; font-weight:bold; color:var(--sw-gold);">+0</div></div>`;
            });
            load();
            calculate();
        }

        function calculate() {
            const xp = parseInt(document.getElementById('xpInput').value) || 0;
            let level = 1;
            for (let i = 0; i < xpTable.length; i++) { if (xp >= xpTable[i]) level = i + 1; }

            // UI Updates
            document.getElementById('lvlDisplay').innerText = level;
            const nextXP = xpTable[level] || "MAX";
            document.getElementById('nextLevelMsg').innerText = level < 20 ? `Next level at ${nextXP} XP` : "Max Level Reached";
            
            const currentMilestone = xpTable[level - 1];
            const nextMilestone = xpTable[level] || xpTable[level - 1];
            const progress = level === 20 ? 100 : ((xp - currentMilestone) / (nextMilestone - currentMilestone)) * 100;
            document.getElementById('xpFill').style.width = progress + "%";

            // Level Benefits (Table 3-1)
            let benefitText = "";
            if (level % 3 === 0) benefitText += " ✨ NEW FEAT GAINED!";
            if (level % 4 === 0) benefitText += " 💪 ABILITY INCREASE (Choose 2)!";
            
            const cName = document.getElementById('classSelect').value;
            const cData = classData[cName];

            document.getElementById('refVal').innerText = 10 + level + getModValue('DEX') + cData.ref;
            document.getElementById('fortVal').innerText = 10 + level + getModValue('CON') + cData.fort;
            document.getElementById('willVal').innerText = 10 + level + getModValue('WIS') + cData.will;

            stats.forEach(s => {
                const m = getModValue(s);
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });

            skills.forEach((s, i) => {
                const total = Math.floor(level/2) + getModValue(s.a) + (document.getElementById(`skT_${i}`).checked ? 5 : 0) + (document.getElementById(`skF_${i}`).checked ? 5 : 0);
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });

            document.getElementById('log').innerHTML = `<div>Status: Level ${level} Hero</div><div style="color:var(--green)">${benefitText}</div>`;
            save();
        }

        function getModValue(stat) {
            const base = parseInt(document.getElementById(`base_${stat}`).value) || 10;
            return Math.floor((base - 10) / 2);
        }

        function save() {
            const data = {};
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            localStorage.setItem('saga_hero_table31_v1', JSON.stringify(data));
        }
        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_table31_v1'));
            if(data) {
                Object.keys(data).forEach(id => { const el = document.getElementById(id); if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; } });
            }
        }
        setup();
    </script>
</body>
</html>
