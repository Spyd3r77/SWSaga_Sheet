<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saga Hero Pro</title>

    <link rel="icon" type="image/webp" href="icon.webp?v=7">
    <link rel="apple-touch-icon" href="icon.webp?v=7">
    
    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 140px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; }
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: bold; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; }
        .btn { background: var(--sw-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .skill-row { display: grid; grid-template-columns: 1fr 45px 45px 55px; gap: 5px; align-items: center; font-size: 0.85rem; border-bottom: 1px solid #333; padding: 8px 0; }
        .class-row { display: grid; grid-template-columns: 1fr 60px 40px; gap: 8px; margin-bottom: 8px; align-items: center; }
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 20px; font-size: 0.95rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 2000; box-sizing: border-box; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col" style="flex:0.4"><label>Total Level</label><div id="totalLvlDisplay" class="val" style="font-size:1.1rem; padding:8px; background:#222; border-radius:6px; text-align:center;">1</div></div>
        </div>
        <div class="col"><label>Species</label>
            <select id="speciesSelect" onchange="calculate()">
                <option value="Human">Human</option>
                <option value="Zabrak">Zabrak</option>
                <option value="Miraluka">Miraluka</option>
                <option value="Togruta">Togruta</option>
                <option value="Wookiee">Wookiee</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h2>Classes (Multiclass)</h2>
        <div id="classListContainer"></div>
        <button class="btn" style="background:#444; width:100%; margin-top:8px;" onclick="addClassRow()">+ Add Class</button>
    </div>

    <div class="card">
        <h2>Abilities</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses & BAB</h2>
        <div class="stat-grid" style="margin-bottom:10px;">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
        <div class="def-box"><label>Total BAB</label><span class="val" id="babDisplay">0</span></div>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div id="skillList"></div>
    </div>

    <div class="card">
        <h2>Feats & Talents</h2>
        <textarea id="feats" rows="6"></textarea>
    </div>

    <div id="log">Force Multiclassing Engaged.</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'},
            {n:'Endurance', a:'CON'}, {n:'Initiative', a:'DEX'}, {n:'Perception', a:'WIS'},
            {n:'Persuasion', a:'CHA'}, {n:'Stealth', a:'DEX'}, {n:'Use the Force', a:'CHA'}
        ];

        const classData = {
            "Jedi": { bab: 1, ref: 1, fort: 1, will: 1, feats: "Force Sensitivity, Lightsabers" },
            "Noble": { bab: 0.75, ref: 1, fort: 0, will: 2, feats: "Pistols, Linguist" },
            "Scoundrel": { bab: 0.75, ref: 2, fort: 0, will: 1, feats: "Pistols, Point Blank Shot" },
            "Scout": { bab: 0.75, ref: 1, fort: 1, will: 1, feats: "Rifles, Shake it Off" },
            "Soldier": { bab: 1, ref: 1, fort: 2, will: 0, feats: "Armor, Rifles, Pistols" }
        };

        const speciesData = {
            "Human": {mod:{}, note: "Human: +1 Feat, +1 Skill."},
            "Zabrak": {mod:{}, note: "Zabrak: +1 Defenses."},
            "Miraluka": {mod:{INT:2, CON:-2}}, "Togruta": {mod:{DEX:2, CON:-2}}, "Wookiee": {mod:{STR:4, CON:2, DEX:-2}}
        };

        let charClasses = [{name: 'Jedi', lvl: 1}];

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="base_${s}" value="10" oninput="calculate()"><div id="mod_${s}" style="text-align:center; font-weight:bold;">+0</div></div>`;
            });
            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => {
                skList.innerHTML += `<div class="skill-row"><span>${s.n}</span><input type="checkbox" id="skT_${i}" onchange="calculate()"><input type="checkbox" id="skF_${i}" onchange="calculate()"><div id="skVal_${i}" style="text-align:right; font-weight:bold; color:var(--sw-gold);">+0</div></div>`;
            });
            load();
            renderClasses();
            calculate();
        }

        function addClassRow() {
            charClasses.push({name: 'Soldier', lvl: 1});
            renderClasses();
            calculate();
        }

        function removeClass(i) {
            if(charClasses.length > 1) {
                charClasses.splice(i, 1);
                renderClasses();
                calculate();
            }
        }

        function renderClasses() {
            const cont = document.getElementById('classListContainer');
            cont.innerHTML = '';
            charClasses.forEach((c, i) => {
                cont.innerHTML += `
                <div class="class-row">
                    <select onchange="charClasses[${i}].name=this.value; calculate()">
                        ${Object.keys(classData).map(cn => `<option value="${cn}" ${cn === c.name ? 'selected' : ''}>${cn}</option>`).join('')}
                    </select>
                    <input type="number" value="${c.lvl}" oninput="charClasses[${i}].lvl=parseInt(this.value)||0; calculate()">
                    <button class="btn" style="background:var(--red); padding:8px;" onclick="removeClass(${i})">X</button>
                </div>`;
            });
        }

        function getModValue(stat) {
            const base = parseInt(document.getElementById(`base_${stat}`).value) || 10;
            const sp = document.getElementById('speciesSelect').value;
            const spec = speciesData[sp].mod[stat] || 0;
            return Math.floor((base + spec - 10) / 2);
        }

        function calculate() {
            let totalLvl = 0; let totalBab = 0;
            let maxRef = 0; let maxFort = 0; let maxWill = 0;

            charClasses.forEach(c => {
                const d = classData[c.name];
                totalLvl += c.lvl;
                totalBab += (c.lvl * d.bab);
                if(d.ref > maxRef) maxRef = d.ref;
                if(d.fort > maxFort) maxFort = d.fort;
                if(d.will > maxWill) maxWill = d.will;
            });

            document.getElementById('totalLvlDisplay').innerText = totalLvl;
            document.getElementById('babDisplay').innerText = Math.floor(totalBab);

            const zBonus = (document.getElementById('speciesSelect').value === "Zabrak") ? 1 : 0;
            document.getElementById('refVal').innerText = 10 + totalLvl + getModValue('DEX') + maxRef + zBonus;
            document.getElementById('fortVal').innerText = 10 + totalLvl + getModValue('CON') + maxFort + zBonus;
            document.getElementById('willVal').innerText = 10 + totalLvl + getModValue('WIS') + maxWill + zBonus;

            stats.forEach(s => {
                const m = getModValue(s);
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });

            skills.forEach((s, i) => {
                const total = Math.floor(totalLvl/2) + getModValue(s.a) + (document.getElementById(`skT_${i}`).checked ? 5 : 0) + (document.getElementById(`skF_${i}`).checked ? 5 : 0);
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });

            document.getElementById('log').innerHTML = `<b>Starting Feats (${charClasses[0].name}):</b> ${classData[charClasses[0].name].feats}`;
            save();
        }

        function save() {
            const data = { charClasses };
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            localStorage.setItem('saga_hero_v13', JSON.stringify(data));
        }
        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_v13'));
            if(data) {
                if(data.charClasses) charClasses = data.charClasses;
                Object.keys(data).forEach(id => { const el = document.getElementById(id); if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; } });
            }
        }
        setup();
    </script>
</body>
</html>
