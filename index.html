<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saga Hero Pro</title>

    <link rel="icon" type="image/webp" href="icon.webp?v=6">
    <link rel="apple-touch-icon" href="icon.webp?v=6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 140px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; }
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: bold; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; }
        .btn { background: var(--sw-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .skill-row { display: grid; grid-template-columns: 1fr 45px 45px 55px; gap: 5px; align-items: center; font-size: 0.85rem; border-bottom: 1px solid #333; padding: 8px 0; }
        .weapon-card { background: #111; border: 1px solid #444; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 20px; font-size: 0.95rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 2000; box-sizing: border-box; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col" style="flex:0.3"><label>Lvl</label><input type="number" id="lvl" value="1" oninput="calculate()"></div>
        </div>
        <div class="flex">
            <div class="col">
                <label>Species</label>
                <select id="speciesSelect" onchange="applySpecies()">
                    <option value="Human">Human</option>
                    <option value="Zabrak">Zabrak</option>
                    <option value="Miraluka">Miraluka</option>
                    <option value="Togruta">Togruta</option>
                    <option value="Wookiee">Wookiee</option>
                </select>
            </div>
            <div class="col">
                <label>Class</label>
                <select id="classSelect" onchange="calculate()">
                    <option value="Jedi">Jedi</option>
                    <option value="Noble">Noble</option>
                    <option value="Scoundrel">Scoundrel</option>
                    <option value="Scout">Scout</option>
                    <option value="Soldier">Soldier</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Abilities</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses & BAB</h2>
        <div class="stat-grid" style="margin-bottom:10px;">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
        <div class="def-box"><label>Current BAB</label><span class="val" id="babDisplay">0</span></div>
    </div>

    <div class="card">
        <h2>Combat</h2>
        <div id="weaponsContainer"></div>
        <button class="btn" style="background:#444; width:100%" onclick="addWeapon()">+ Weapon</button>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div id="skillList"></div>
    </div>

    <div class="card">
        <h2>Feats & Talents</h2>
        <textarea id="feats" rows="6"></textarea>
    </div>

    <div id="log">Ready for Duty.</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'},
            {n:'Endurance', a:'CON'}, {n:'Initiative', a:'DEX'}, {n:'Perception', a:'WIS'},
            {n:'Persuasion', a:'CHA'}, {n:'Stealth', a:'DEX'}, {n:'Use the Force', a:'CHA'}
        ];

        const classData = {
            "Jedi": { bab: 1, ref: 1, fort: 1, will: 1, feats: "Force Sensitivity, WP (Lightsabers), WP (Simple Weapons)" },
            "Noble": { bab: 0.75, ref: 1, fort: 0, will: 2, feats: "WP (Pistols), WP (Simple Weapons), Linguist" },
            "Scoundrel": { bab: 0.75, ref: 2, fort: 0, will: 1, feats: "WP (Pistols), WP (Simple Weapons), Point Blank Shot" },
            "Scout": { bab: 0.75, ref: 1, fort: 1, will: 1, feats: "WP (Pistols), WP (Rifles), WP (Simple Weapons), Shake it Off" },
            "Soldier": { bab: 1, ref: 1, fort: 2, will: 0, feats: "AP (Light), AP (Medium), WP (Pistols), WP (Rifles), WP (Simple Weapons)" }
        };

        const speciesData = {
            "Human": {mod:{}, note: "Human: +1 Feat, +1 Skill."},
            "Zabrak": {mod:{}, note: "Zabrak: +1 All Defenses."},
            "Miraluka": {mod:{INT:2, CON:-2}},
            "Togruta": {mod:{DEX:2, CON:-2}},
            "Wookiee": {mod:{STR:4, CON:2, DEX:-2}}
        };

        let weaponCount = 0;

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="base_${s}" value="10" oninput="calculate()"><div id="mod_${s}" style="text-align:center; font-weight:bold;">+0</div></div>`;
            });
            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => {
                skList.innerHTML += `<div class="skill-row"><span>${s.n}</span><input type="checkbox" id="skT_${i}" onchange="calculate()"><input type="checkbox" id="skF_${i}" onchange="calculate()"><div id="skVal_${i}" style="text-align:right; font-weight:bold; color:var(--sw-gold);">+0</div></div>`;
            });
            load();
            if(weaponCount === 0) addWeapon();
            calculate();
        }

        function getModValue(stat) {
            const base = parseInt(document.getElementById(`base_${stat}`).value) || 10;
            const sp = document.getElementById('speciesSelect').value;
            const spec = speciesData[sp].mod[stat] || 0;
            return Math.floor((base + spec - 10) / 2);
        }

        function calculate() {
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const className = document.getElementById('classSelect').value;
            const cData = classData[className];
            const sp = document.getElementById('speciesSelect').value;
            
            // Calculate BAB
            const bab = Math.floor(lvl * cData.bab);
            document.getElementById('babDisplay').innerText = bab;

            // Calculate Defenses
            const zBonus = (sp === "Zabrak") ? 1 : 0;
            document.getElementById('refVal').innerText = 10 + lvl + getModValue('DEX') + cData.ref + zBonus;
            document.getElementById('fortVal').innerText = 10 + lvl + getModValue('CON') + cData.fort + zBonus;
            document.getElementById('willVal').innerText = 10 + lvl + getModValue('WIS') + cData.will + zBonus;

            // Update Stats Display
            stats.forEach(s => {
                const m = getModValue(s);
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });

            // Skills
            skills.forEach((s, i) => {
                const total = Math.floor(lvl/2) + getModValue(s.a) + (document.getElementById(`skT_${i}`).checked ? 5 : 0) + (document.getElementById(`skF_${i}`).checked ? 5 : 0);
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });

            // Note: We don't overwrite the Feats box so you can add your own, 
            // but we display the starting ones in the Log.
            document.getElementById('log').innerHTML = `<b>${className} Feats:</b> ${cData.feats}`;
            save();
        }

        function addWeapon() {
            const id = weaponCount++;
            const div = document.createElement('div');
            div.className = 'weapon-card';
            div.innerHTML = `<input type="text" id="wName_${id}" placeholder="Weapon"><div class="flex"><div class="col"><label>Type</label><select id="wType_${id}"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></div><div class="col"><label>Dmg</label><input type="text" id="wDmg_${id}" placeholder="2d8"></div></div><div class="flex"><button class="btn" style="flex:1" onclick="rollAtk(${id})">Atk</button><button class="btn" style="flex:1; background:var(--red)" onclick="rollDmg(${id})">Dmg</button></div>`;
            document.getElementById('weaponsContainer').appendChild(div);
        }

        function rollAtk(id) {
            const bab = parseInt(document.getElementById('babDisplay').innerText);
            const mod = getModValue(document.getElementById(`wType_${id}`).value === 'melee' ? 'STR' : 'DEX');
            const d20 = Math.floor(Math.random() * 20) + 1;
            document.getElementById('log').innerHTML = `Roll: ${d20} + ${bab} + ${mod} = <b>${d20+bab+mod}</b>`;
        }

        function rollDmg(id) {
            const formula = document.getElementById(`wDmg_${id}`).value || "1d8";
            const bonus = Math.floor(parseInt(document.getElementById('lvl').value)/2);
            const d = formula.split('d');
            let sum = 0;
            for(let i=0; i<d[0]; i++) sum += Math.floor(Math.random() * d[1]) + 1;
            document.getElementById('log').innerHTML = `Damage: ${sum} + ${bonus} = <b>${sum+bonus}</b>`;
        }

        function applySpecies() { calculate(); }
        function save() {
            const data = { weaponCount };
            document.querySelectorAll('input, select, textarea').forEach(el => { if(el.id) data[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            localStorage.setItem('saga_hero_v12', JSON.stringify(data));
        }
        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_v12'));
            if(data) {
                for(let i=1; i<data.weaponCount; i++) addWeapon();
                Object.keys(data).forEach(id => { const el = document.getElementById(id); if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; } });
            }
        }
        setup();
    </script>
</body>
</html>
