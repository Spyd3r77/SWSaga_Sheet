<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saga Hero Master</title>
    <style>
        :root { --sw-blue: #2e67f8; --sw-gold: #ffe81f; --bg: #0f0f0f; --card: #1c1c1c; --text: #eee; --red: #cc0000; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 120px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #333; }
        h2 { color: var(--sw-gold); margin: 0 0 10px 0; font-size: 0.9rem; text-transform: uppercase; border-bottom: 1px solid var(--sw-blue); padding-bottom: 4px; }
        .flex { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; width: 100%; box-sizing: border-box; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .def-box { background: #000; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid var(--sw-blue); }
        .val { display: block; font-size: 1.4rem; font-weight: bold; }
        .btn { background: var(--sw-blue); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .skill-row { display: grid; grid-template-columns: 1fr 40px 40px 50px; gap: 5px; align-items: center; font-size: 0.8rem; border-bottom: 1px solid #333; padding: 4px 0; }
        #log { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: var(--sw-gold); padding: 15px; font-size: 1rem; border-top: 3px solid var(--sw-gold); text-align: center; z-index: 1000; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex">
            <div class="col"><label>Name</label><input type="text" id="charName"></div>
            <div class="col" style="flex:0.4"><label>Level</label><input type="number" id="lvl" value="1" oninput="calculate()"></div>
        </div>
        <div class="col">
            <label>Species</label>
            <select id="speciesSelect" onchange="applySpecies()">
                <option value="Human">Human (Selectable Bonus)</option>
                <option value="Bothan">Bothan (+2 Dex, -2 Con)</option>
                <option value="Cerean">Cerean (+2 Int, +2 Wis, -2 Dex)</option>
                <option value="Duros">Duros (+2 Dex, +2 Int, -2 Con)</option>
                <option value="Ewok">Ewok (+2 Dex, -2 Str)</option>
                <option value="Gamorrean">Gamorrean (+2 Str, -2 Int, -2 Cha)</option>
                <option value="Ithorian">Ithorian (+2 Wis, +2 Cha, -2 Dex)</option>
                <option value="Kel Dor">Kel Dor (+2 Dex, +2 Wis, -2 Con)</option>
                <option value="Mon Calamari">Mon Calamari (+2 Int, +2 Wis, -2 Con)</option>
                <option value="Quarren">Quarren (+2 Con, -2 Wis, -2 Cha)</option>
                <option value="Rodian">Rodian (+2 Dex, -2 Wis, -2 Cha)</option>
                <option value="Trandoshan">Trandoshan (+2 Str, -2 Dex)</option>
                <option value="Twi'lek">Twi'lek (+2 Cha, -2 Wis)</option>
                <option value="Wookiee">Wookiee (+2 Str, +2 Con, -2 Dex)</option>
                <option value="Zabrak">Zabrak (All-around)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h2>Abilities</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses</h2>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Skills</h2>
        <div class="skill-row" style="color:var(--sw-gold); font-weight:bold;">
            <span>Skill</span><span>Trn</span><span>Foc</span><span>Total</span>
        </div>
        <div id="skillList"></div>
    </div>

    <div id="log">Welcome, Hero.</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        const skills = [
            {n:'Acrobatics', a:'DEX'}, {n:'Climb', a:'STR'}, {n:'Deception', a:'CHA'},
            {n:'Endurance', a:'CON'}, {n:'Gather Info', a:'CHA'}, {n:'Initiative', a:'DEX'},
            {n:'Jump', a:'STR'}, {n:'Mechanics', a:'INT'}, {n:'Perception', a:'WIS'},
            {n:'Persuasion', a:'CHA'}, {n:'Pilot', a:'DEX'}, {n:'Stealth', a:'DEX'},
            {n:'Survival', a:'WIS'}, {n:'Use Computer', a:'INT'}, {n:'Use the Force', a:'CHA'}
        ];

        const speciesMods = {
            "Bothan": {DEX:2, CON:-2}, "Cerean": {INT:2, WIS:2, DEX:-2}, "Duros": {DEX:2, INT:2, CON:-2},
            "Ewok": {DEX:2, STR:-2}, "Gamorrean": {STR:2, INT:-2, CHA:-2}, "Ithorian": {WIS:2, CHA:2, DEX:-2},
            "Kel Dor": {DEX:2, WIS:2, CON:-2}, "Mon Calamari": {INT:2, WIS:2, CON:-2}, "Quarren": {CON:2, WIS:-2, CHA:-2},
            "Rodian": {DEX:2, WIS:-2, CHA:-2}, "Trandoshan": {STR:2, DEX:-2}, "Twi'lek": {CHA:2, WIS:-2},
            "Wookiee": {STR:2, CON:2, DEX:-2}, "Human": {}, "Zabrak": {}
        };

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `
                    <div class="col">
                        <label>${s}</label>
                        <input type="number" id="base_${s}" value="10" oninput="calculate()">
                        <div id="specLabel_${s}" style="font-size:0.6rem; color:var(--sw-gold); text-align:center;">+0 Spec</div>
                        <div id="mod_${s}" style="text-align:center; color:white; font-weight:bold;">+0</div>
                    </div>`;
            });

            const skList = document.getElementById('skillList');
            skills.forEach((s, i) => {
                skList.innerHTML += `
                    <div class="skill-row">
                        <span>${s.n}</span>
                        <input type="checkbox" id="skT_${i}" onchange="calculate()">
                        <input type="checkbox" id="skF_${i}" onchange="calculate()">
                        <div id="skVal_${i}" style="text-align:right; font-weight:bold;">+0</div>
                    </div>`;
            });
            load();
            calculate();
        }

        function applySpecies() {
            const sp = document.getElementById('speciesSelect').value;
            const mods = speciesMods[sp] || {};
            stats.forEach(s => {
                const val = mods[s] || 0;
                document.getElementById(`specLabel_${s}`).innerText = (val >= 0 ? '+' : '') + val + ' Spec';
            });
            calculate();
        }

        function calculate() {
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const hLvl = Math.floor(lvl / 2);
            const currentMods = {};
            const sp = document.getElementById('speciesSelect').value;
            const spMods = speciesMods[sp] || {};

            stats.forEach(s => {
                const base = parseInt(document.getElementById(`base_${s}`).value) || 10;
                const spec = spMods[s] || 0;
                const total = base + spec;
                const m = Math.floor((total - 10) / 2);
                currentMods[s] = m;
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });

            document.getElementById('refVal').innerText = 10 + lvl + currentMods['DEX'];
            document.getElementById('fortVal').innerText = 10 + lvl + currentMods['CON'];
            document.getElementById('willVal').innerText = 10 + lvl + currentMods['WIS'];

            skills.forEach((s, i) => {
                const t = document.getElementById(`skT_${i}`).checked ? 5 : 0;
                const f = document.getElementById(`skF_${i}`).checked ? 5 : 0;
                const total = hLvl + currentMods[s.a] + t + f;
                document.getElementById(`skVal_${i}`).innerText = (total >= 0 ? '+' : '') + total;
            });
            save();
        }

        function save() {
            const data = {};
            document.querySelectorAll('input, select').forEach(el => data[el.id] = el.type === 'checkbox' ? el.checked : el.value);
            localStorage.setItem('saga_hero_v4', JSON.stringify(data));
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_v4'));
            if(data) Object.keys(data).forEach(id => {
                const el = document.getElementById(id);
                if(el) { if(el.type === 'checkbox') el.checked = data[id]; else el.value = data[id]; }
            });
        }
        setup();
    </script>
</body>
</html>

    <div class="card">
        <h2>Abilities & Defenses</h2>
        <div class="stat-grid" id="abilityContainer"></div>
        <div class="stat-grid" style="margin-top:15px;">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
    </div>

    <div class="card">
        <h2>Force Powers</h2>
        <div id="forcePowersList"></div>
        <div class="flex" style="margin-top:10px;">
            <input type="text" id="newPowerName" placeholder="Power Name">
            <button class="btn" style="background:var(--green)" onclick="addPower()">Add</button>
        </div>
    </div>

    <div class="card">
        <h2>Feats & Talents</h2>
        <textarea id="feats" placeholder="List your Feats and Talents here..."></textarea>
    </div>

    <div class="card">
        <h2>Weapons</h2>
        <div id="weaponsContainer"></div>
        <button class="btn" style="background:#444; width:100%" onclick="addWeapon()">+ Add Weapon</button>
    </div>

    <div id="log">Ready for combat...</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        let weaponCount = 0;
        let powers = [];

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="sc_${s}" value="10" oninput="calculate()"><div id="mod_${s}" style="text-align:center; color:var(--sw-gold); font-size:0.8rem; font-weight:bold;">+0</div></div>`;
            });
            load();
            if(weaponCount === 0) addWeapon();
            renderPowers();
            calculate();
        }

        function addPower() {
            const name = document.getElementById('newPowerName').value;
            if(!name) return;
            powers.push({ name: name, spent: false });
            document.getElementById('newPowerName').value = '';
            renderPowers();
            save();
        }

        function togglePower(index) {
            powers[index].spent = !powers[index].spent;
            renderPowers();
            save();
        }

        function renderPowers() {
            const list = document.getElementById('forcePowersList');
            list.innerHTML = '';
            powers.forEach((p, i) => {
                list.innerHTML += `
                    <div class="power-item ${p.spent ? 'spent' : ''}">
                        <span>${p.name}</span>
                        <button class="btn" style="background:${p.spent ? '#555' : 'var(--sw-blue)'}" onclick="togglePower(${i})">
                            ${p.spent ? 'Recharge' : 'Use'}
                        </button>
                    </div>`;
            });
        }

        function addWeapon() {
            const id = weaponCount++;
            const div = document.createElement('div');
            div.className = 'card';
            div.style.background = '#111';
            div.innerHTML = `
                <input type="text" id="wName_${id}" placeholder="Weapon Name" style="margin-bottom:8px;">
                <div class="flex">
                    <div class="col"><label>Type</label><select id="wType_${id}"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></div>
                    <div class="col"><label>Dice</label><input type="text" id="wDmg_${id}" placeholder="2d8"></div>
                </div>
                <div class="flex" style="margin-top:10px;">
                    <button class="btn" onclick="rollAtk(${id})">Atk</button>
                    <button class="btn" style="background:var(--red)" onclick="rollDmg(${id})">Dmg</button>
                </div>`;
            document.getElementById('weaponsContainer').appendChild(div);
        }

        function rollAtk(id) {
            const bab = parseInt(document.getElementById('bab').value) || 0;
            const type = document.getElementById(`wType_${id}`).value;
            const mod = type === 'melee' ? getMod('STR') : getMod('DEX');
            const d20 = Math.floor(Math.random() * 20) + 1;
            const total = d20 + bab + mod;
            document.getElementById('log').innerHTML = `Attack: ${d20} + ${bab}(BAB) + ${mod}(Mod) = <strong>${total}</strong>`;
        }

        function rollDmg(id) {
            const formula = document.getElementById(`wDmg_${id}`).value || "1d6";
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const hLvl = Math.floor(lvl / 2);
            const strMod = getMod('STR');
            const bonus = document.getElementById(`wType_${id}`).value === 'melee' ? (hLvl + strMod) : hLvl;
            
            const parts = formula.toLowerCase().split('d');
            const n = parseInt(parts[0]) || 1;
            const s = parseInt(parts[1]) || 6;
            let sum = 0;
            for(let i=0; i<n; i++) sum += Math.floor(Math.random() * s) + 1;
            document.getElementById('log').innerHTML = `Damage: [${sum}] + ${bonus}(Heroic) = <strong>${sum + bonus}</strong>`;
        }

        function getMod(stat) {
            return Math.floor((parseInt(document.getElementById(`sc_${stat}`).value) - 10) / 2);
        }

        function calculate() {
            stats.forEach(s => {
                const m = getMod(s);
                document.getElementById(`mod_${s}`).innerText = (m >= 0 ? '+' : '') + m;
            });
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            document.getElementById('refVal').innerText = 10 + lvl + getMod('DEX');
            document.getElementById('fortVal').innerText = 10 + lvl + getMod('CON');
            document.getElementById('willVal').innerText = 10 + lvl + getMod('WIS');
            save();
        }

        function save() {
            const data = { weaponCount, powers };
            document.querySelectorAll('input, textarea, select').forEach(el => {
                if(el.id) data[el.id] = el.value;
            });
            localStorage.setItem('saga_hero_v3', JSON.stringify(data));
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('saga_hero_v3'));
            if(data) {
                powers = data.powers || [];
                for(let i=1; i<data.weaponCount; i++) addWeapon();
                Object.keys(data).forEach(id => {
                    if(document.getElementById(id)) document.getElementById(id).value = data[id];
                });
            }
        }
        setup();
    </script>
</body>
</html>
        </div>
    </div>

    <div class="card">
        <h2>Condition Track</h2>
        <div class="flex" id="conditionTrack">
            <button class="cond-btn cond-active" onclick="setCond(0, this)">Normal</button>
            <button class="cond-btn" onclick="setCond(-1, this)">-1</button>
            <button class="cond-btn" onclick="setCond(-2, this)">-2</button>
            <button class="cond-btn" onclick="setCond(-5, this)">-5</button>
            <button class="cond-btn" onclick="setCond(-10, this)">-10</button>
        </div>
    </div>

    <div class="card">
        <h2>Ability Scores</h2>
        <div class="stat-grid" id="abilityContainer"></div>
    </div>

    <div class="card">
        <h2>Defenses & HP</h2>
        <div class="stat-grid">
            <div class="def-box"><label>REF</label><span class="val" id="refVal">10</span></div>
            <div class="def-box"><label>FORT</label><span class="val" id="fortVal">10</span></div>
            <div class="def-box"><label>WILL</label><span class="val" id="willVal">10</span></div>
        </div>
        <div class="flex" style="margin-top:10px">
            <div class="col"><label>Current HP</label><input type="number" id="hpCur" value="30"></div>
            <div class="col"><label>Max HP</label><input type="number" id="hpMax" value="30"></div>
        </div>
    </div>

    <div class="card">
        <h2>Weapons & Attacks</h2>
        <div id="weaponsContainer"></div>
        <button class="btn" style="background:#444; width:100%" onclick="addWeapon()">+ Add New Weapon</button>
    </div>

    <div id="log">Awaiting action...</div>

    <script>
        const stats = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
        let weaponCount = 0;
        let activePenalty = 0;

        function setup() {
            const abCont = document.getElementById('abilityContainer');
            stats.forEach(s => {
                abCont.innerHTML += `<div class="col"><label>${s}</label><input type="number" id="sc_${s}" value="10" oninput="calculate()"><div id="mod_${s}" style="text-align:center; color:var(--sw-gold); font-weight:bold; margin-top:4px;">+0</div></div>`;
            });
            load();
            if(weaponCount === 0) addWeapon();
            calculate();
        }

        function setCond(val, btn) {
            activePenalty = val;
            document.querySelectorAll('.cond-btn').forEach(b => b.classList.remove('cond-active'));
            btn.classList.add('cond-active');
            document.getElementById('log').innerHTML = `Condition set to ${val}. Roll penalties applied.`;
        }

        function addWeapon() {
            const id = weaponCount++;
            const div = document.createElement('div');
            div.className = 'weapon-card';
            div.innerHTML = `
                <input type="text" id="wName_${id}" placeholder="Weapon (e.g. Lightsaber)" style="width:100%; box-sizing:border-box; margin-bottom:10px;">
                <div class="flex">
                    <div class="col"><label>Type</label><select id="wType_${id}"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></div>
                    <div class="col"><label>Atk Bonus</label><input type="number" id="wAtk_${id}" value="0"></div>
                    <div class="col"><label>Dice</label><input type="text" id="wDmg_${id}" placeholder="2d8"></div>
                </div>
                <div class="flex" style="margin-top:10px;">
                    <button class="btn" onclick="rollAtk(${id})">Attack</button>
                    <button class="btn dmg-btn" onclick="rollDmg(${id})">Damage</button>
                </div>
            `;
            document.getElementById('weaponsContainer').appendChild(div);
        }

        function rollAtk(id) {
            const name = document.getElementById(`wName_${id}`).value || "Weapon";
            const bonus = parseInt(document.getElementById(`wAtk_${id}`).value) || 0;
            const d20 = Math.floor(Math.random() * 20) + 1;
            const total = d20 + bonus + activePenalty;
            document.getElementById('log').innerHTML = `${name} Attack: ${d20} + ${bonus} (Pen: ${activePenalty}) = <strong>${total}</strong>`;
        }

        function rollDmg(id) {
            const name = document.getElementById(`wName_${id}`).value || "Weapon";
            const formula = document.getElementById(`wDmg_${id}`).value || "1d6";
            const type = document.getElementById(`wType_${id}`).value;
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const hLvl = Math.floor(lvl / 2);
            const strMod = Math.floor((parseInt(document.getElementById('sc_STR').value) - 10) / 2);
            
            const bonus = type === 'melee' ? (hLvl + strMod) : hLvl;

            try {
                const parts = formula.toLowerCase().split('d');
                const n = parseInt(parts[0]) || 1;
                const s = parseInt(parts[1]) || 6;
                let rollSum = 0;
                for(let i=0; i<n; i++) rollSum += Math.floor(Math.random() * s) + 1;
                
                const total = rollSum + bonus;
                document.getElementById('log').innerHTML = `${name} Damage: [${rollSum}] + ${bonus} (Heroic) = <strong>${total}</strong>`;
            } catch(e) { document.getElementById('log').innerHTML = "Check dice format (e.g. 2d8)"; }
        }

        function calculate() {
            const lvl = parseInt(document.getElementById('lvl').value) || 1;
            const mods = {};
            stats.forEach(s => {
                const score = parseInt(document.getElementById(`sc_${s}`).value) || 10;
                mods[s] = Math.floor((score - 10) / 2);
                document.getElementById(`mod_${s}`).innerText = (mods[s] >= 0 ? '+' : '') + mods[s];
            });

            document.getElementById('refVal').innerText = 10 + lvl + mods['DEX'];
            const fort = 10 + lvl + mods['CON'];
            document.getElementById('fortVal').innerText = fort;
            document.getElementById('willVal').innerText = 10 + lvl + mods['WIS'];
            save();
        }

        function save() {
            const data = { weaponCount };
            document.querySelectorAll('input, select').forEach(el => data[el.id] = el.value);
            localStorage.setItem('sw_saga_pro', JSON.stringify(data));
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('sw_saga_pro'));
            if(data) {
                for(let i=0; i<data.weaponCount; i++) if(i > 0) addWeapon();
                Object.keys(data).forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = data[id]; });
            }
        }
        setup();
    </script>
</body>
</html>
